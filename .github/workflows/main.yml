name: Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"
          cache-provider: enhanced
          cache-disabled: false
          cache-read-only: false
          cache-write-only: false
          cache-overwrite-existing: false
          cache-cleanup: on-success
          gradle-home-cache-includes: caches
          add-job-summary: always
          dependency-graph: disabled
          validate-wrappers: false
          allow-snapshot-wrappers: false
          gradle-home-cache-strict-match: false

      - name: Find Android project
        id: project
        shell: bash
        run: |
          PROJECT_DIR="$(dirname "$(find . -type f -name settings.gradle.kts -print -quit)")"
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ] && [ ! -f "./settings.gradle.kts" ]; then
            echo "settings.gradle.kts not found"
            exit 1
          fi

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "app directory not found in $PROJECT_DIR"
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Build APK and AAB
        run: |
          cd "${{ steps.project.outputs.dir }}"
          gradle --no-daemon :app:assembleDebug :app:bundleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: schemer-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: schemer-aab
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/bundle/debug/*.aab
