name: Build Schemer Mobile

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle 9.8
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Build release APK and AAB
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: schemer-mobile-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: schemer-mobile-aab
          path: app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
