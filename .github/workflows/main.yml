name: Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1"
          cache-provider: enhanced
          cache-disabled: false
          cache-read-only: false
          cache-write-only: false
          cache-overwrite-existing: false
          cache-cleanup: on-success
          gradle-home-cache-includes: caches
          add-job-summary: always
          dependency-graph: disabled
          validate-wrappers: true
          allow-snapshot-wrappers: false
          gradle-home-cache-strict-match: false

      - name: Build APK and AAB
        run: |
          gradle --no-daemon :app:assembleDebug :app:bundleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: schemer-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: schemer-aab
          path: app/build/outputs/bundle/debug/*.aab
